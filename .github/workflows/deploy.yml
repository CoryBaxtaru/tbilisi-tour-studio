# Builds, tests and publishes the PWA to GitHub Pages (free for public repositories).
# No secrets are needed: the app holds no keys; the sync token is entered per device.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Notes and handoff files change nothing in the app, so they don't publish it again.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - '.interface-design/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
